# Agentura on dev-serve — demo deployment
# Namespace: srinidhi-agentura
# Cluster: dev-serve
# LLM routing: https://llm-gateway.razorpay.com/
# Images: ghcr.io/srinidhis05/agentura/{executor,gateway}:latest

---
# ── PostgreSQL ──
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: srinidhi-agentura
  labels:
    devstack_label: srinidhi-agentura
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: srinidhi-agentura
  labels:
    devstack_label: srinidhi-agentura
  annotations:
    janitor/ttl: "72h"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: c.rzp.io/proxy_dockerhub/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: agentura
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentura-db
                  key: password
            - name: POSTGRES_DB
              value: agentura
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agentura"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}

---
# ── Executor RBAC (sandbox pod management) ──
apiVersion: v1
kind: ServiceAccount
metadata:
  name: executor
  namespace: srinidhi-agentura
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: srinidhi-agentura
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager-binding
  namespace: srinidhi-agentura
subjects:
  - kind: ServiceAccount
    name: executor
    namespace: srinidhi-agentura
roleRef:
  kind: Role
  name: sandbox-manager
  apiGroup: rbac.authorization.k8s.io

---
# ── Secrets (placeholder — fill before applying) ──
apiVersion: v1
kind: Secret
metadata:
  name: agentura-db
  namespace: srinidhi-agentura
type: Opaque
stringData:
  password: "agentura-demo-2026"
  url: "postgresql://agentura:agentura-demo-2026@postgres:5432/agentura"
---
# agentura-api-keys secret managed manually:
# kubectl -n srinidhi-agentura create secret generic agentura-api-keys \
#   --from-literal=ANTHROPIC_API_KEY=<key> \
#   --from-literal=ANTHROPIC_BASE_URL=https://llm-gateway.razorpay.com

---
# ── Executor ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: srinidhi-agentura
  labels:
    devstack_label: srinidhi-agentura
  annotations:
    janitor/ttl: "72h"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      serviceAccountName: executor
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: git-sync-skills
          image: c.rzp.io/proxy_dockerhub/alpine/git:2.43.0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              REPO="https://github.com/srinidhis05/agentura.git"
              BRANCH="main"
              echo "Cloning ${REPO} (branch: ${BRANCH})..."
              git clone --depth 1 --branch "${BRANCH}" "${REPO}" /repo
              if [ -d "/repo/skills" ]; then cp -a /repo/skills/. /skills/; echo "Synced skills/"; fi
              if [ -d "/repo/examples" ]; then cp -a /repo/examples/. /skills/examples/; echo "Synced examples/"; fi
              if [ -d "/repo/pipelines" ]; then cp -a /repo/pipelines/. /pipelines/; echo "Synced pipelines/"; fi
              if [ -d "/repo/agency" ]; then cp -a /repo/agency/. /agency/; echo "Synced agency/"; fi
              chown -R 1000:1000 /skills /pipelines /agency
              echo "Git sync complete."
          volumeMounts:
            - name: skills
              mountPath: /skills
            - name: pipelines
              mountPath: /pipelines
            - name: agency
              mountPath: /agency
        - name: init-dirs
          image: c.rzp.io/proxy_dockerhub/alpine:3.19
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /artifacts /data/.agentura
              chown -R 1000:1000 /artifacts /data
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: knowledge
              mountPath: /data
      containers:
        - name: executor
          image: c.rzp.io/proxy_dockerhub/srinidhisagentura/agentura-executor:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: SANDBOX_BACKEND
              value: k8s
            - name: SANDBOX_NAMESPACE
              value: srinidhi-agentura
            - name: SANDBOX_IMAGE_PULL_POLICY
              value: Always
            - name: SKILLS_DIR
              value: /skills
            - name: PIPELINES_DIR
              value: /pipelines
            - name: AGENCY_DIR
              value: /agency
            - name: AGENTURA_KNOWLEDGE_DIR
              value: /data/.agentura
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentura-db
                  key: url
            - name: UVICORN_WORKERS
              value: "2"
            - name: CLAUDE_CODE_WORKER_IMAGE
              value: c.rzp.io/proxy_dockerhub/srinidhisagentura/agentura-worker:v3
            - name: CLAUDE_CODE_WORKER_CPU
              value: "1"
            - name: CLAUDE_CODE_WORKER_MEMORY
              value: "1024Mi"
          envFrom:
            - secretRef:
                name: agentura-api-keys
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: skills
              mountPath: /skills
            - name: pipelines
              mountPath: /pipelines
            - name: agency
              mountPath: /agency
            - name: artifacts
              mountPath: /artifacts
            - name: knowledge
              mountPath: /data
      volumes:
        - name: skills
          emptyDir: {}
        - name: pipelines
          emptyDir: {}
        - name: agency
          emptyDir: {}
        - name: artifacts
          emptyDir: {}
        - name: knowledge
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: executor
  namespace: srinidhi-agentura
  labels:
    devstack_label: srinidhi-agentura
spec:
  type: ClusterIP
  selector:
    app: executor
  ports:
    - port: 8000
      targetPort: 8000

---
# ── Gateway ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: srinidhi-agentura
  labels:
    devstack_label: srinidhi-agentura
  annotations:
    janitor/ttl: "72h"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: c.rzp.io/proxy_dockerhub/srinidhisagentura/agentura-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: agentura
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentura-db
                  key: password
            - name: DB_NAME
              value: agentura
            - name: EXECUTOR_URL
              value: http://executor:8000
            - name: EXECUTION_MODE
              value: proxy
          envFrom:
            - secretRef:
                name: agentura-api-keys
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: srinidhi-agentura
  labels:
    devstack_label: srinidhi-agentura
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 3001
      targetPort: 3001

---
# ── Web UI ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: srinidhi-agentura
  labels:
    devstack_label: srinidhi-agentura
  annotations:
    janitor/ttl: "72h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: c.rzp.io/proxy_dockerhub/srinidhisagentura/agentura-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: API_TARGET
              value: http://gateway:3001
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: srinidhi-agentura
  labels:
    devstack_label: srinidhi-agentura
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
